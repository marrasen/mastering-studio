name: Release

# A tag such as v0.1.0 builds the programs for Windows and Linux and
# publishes them as a release, each the one file a user downloads: run
# from anywhere, it installs itself, and installed, it updates itself
# from these releases. Their names and SHA256SUMS are what the updater
# looks for. A run started by hand builds them and keeps them as an
# artifact of the run.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
          fi
      - name: Icon and version resource
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          go run . -write-icon icon.png
          go run github.com/tc-hib/go-winres@v0.3.3 simply --arch amd64 --icon icon.png --manifest none \
            --product-name "Marras Mastering Studio" --file-description "Marras Mastering Studio" \
            --product-version "$VERSION" --file-version "$VERSION" \
            --copyright "Copyright 2026 Marcus Johansson" --original-filename mastering-studio.exe
      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          for target in windows/amd64 linux/amd64; do
            goos=${target%/*} goarch=${target#*/}
            ext=""; flags="-s -w -X main.version=$VERSION"
            if [[ $goos == windows ]]; then ext=.exe; flags="-H windowsgui $flags"; fi
            GOOS=$goos GOARCH=$goarch CGO_ENABLED=0 go build -trimpath -ldflags "$flags" \
              -o "dist/mastering-studio_${VERSION}_${goos}_${goarch}${ext}" .
          done
          cd dist && sha256sum mastering-studio_* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: mastering-studio
          path: dist/*
      - name: Publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Marras Mastering Studio $GITHUB_REF_NAME" --generate-notes
